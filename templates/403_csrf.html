<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Güvenlik doğrulaması başarısız | SDS-07 Servis Masası</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f2f4f6; color: #172235; }
    main { max-width: 36rem; margin: 12vh auto; padding: 2rem; background: #fff; border: 1px solid #d3d9e0; border-radius: .5rem; }
    h1 { font-size: 1.5rem; margin-top: 0; }
    a { color: #2449b8; }
  </style>
</head>
<body>
  <main data-testid="error-csrf">
    <p>Hata 403</p>
    <h1>Form güvenlik doğrulamasından geçmedi</h1>
    <p>Formun güvenlik belirteci (CSRF) eksik veya süresi dolmuş. Sayfayı yenileyip işlemi yeniden deneyin. Tarayıcınızda çerezler kapalıysa açmanız gerekir.</p>
    <p><a href="{% url 'login' %}">Giriş sayfasına dön</a></p>
  </main>
</body>
</html>
